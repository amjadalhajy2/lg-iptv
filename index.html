<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
    <title>Stream IPTV - Premium Ultimate TV UI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #000000; --primary: #e50914; --text: #ffffff; --surface: #141414; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; padding: 0; overflow: hidden; user-select: none; width: 100vw; height: 100vh;
        }
        ::-webkit-scrollbar { display: none; }
        .hidden { display: none !important; }
        .svg-icon { fill: currentColor; width: 1.2em; height: 1.2em; vertical-align: middle; }

        .scrollable-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; z-index: 50; background: var(--bg);
        }

        #toast {
            visibility: hidden; min-width: 25vw; background-color: rgba(229, 9, 20, 0.95); color: #fff;
            text-align: center; border-radius: 1vw; padding: 1.5vw 2vw; position: fixed;
            z-index: 10000; left: 50%; transform: translateX(-50%); bottom: 5vh; font-size: 1.5vw; font-weight: bold;
            box-shadow: 0 1vh 3vh rgba(0,0,0,0.8); transition: opacity 0.4s; opacity: 0; backdrop-filter: blur(10px);
        }
        #toast.show { visibility: visible; opacity: 1; }

        /* الترويسة العلوية الذكية (سطر واحد دائمًا) */
        header {
            position: sticky; top: 0; left: 0; width: 100vw; height: 12vh; padding: 0 4vw;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            display: flex; align-items: center; justify-content: space-between; z-index: 100; transition: background 0.3s;
            flex-wrap: nowrap;
        }
        header.scrolled { background: rgba(15,15,15,0.98); backdrop-filter: blur(20px); border-bottom: 0.1vw solid rgba(255,255,255,0.08); }
        
        .logo { font-size: 2.5vw; font-weight: 900; color: var(--primary); letter-spacing: 2px; text-shadow: 2px 2px 8px black; flex-shrink: 0; }
        .nav-links { display: flex; gap: 1.5vw; align-items: center; flex-shrink: 0; }
        .nav-item { 
            background: transparent; border: 0.2vw solid transparent; color: white; font-size: 1.5vw; font-weight: 600; 
            cursor: pointer; padding: 0.8vw 1.5vw; border-radius: 2vw; transition: 0.3s; outline: none; display: flex; align-items: center; gap: 0.5vw; white-space: nowrap;
        }
        .nav-item svg { width: 1.8vw; height: 1.8vw; }
        .nav-item:focus, .nav-item:hover { transform: scale(1.05); background: rgba(255,255,255,0.15); border-color: white; }
        .nav-item.active { background: white; color: black; font-weight: 800; }
        
        .search-box input {
            background: rgba(255,255,255,0.15); border: 0.2vw solid transparent; color: white; padding: 0.8vw 1.5vw; 
            border-radius: 2vw; font-size: 1.2vw; outline: none; transition: 0.3s; width: 15vw; backdrop-filter: blur(10px);
        }
        .search-box input:focus { background: rgba(0,0,0,0.9); width: 25vw; border-color: var(--primary); }
        
        .user-info { display: flex; align-items: center; gap: 1vw; font-size: 1.3vw; font-weight: bold; flex-shrink: 0; }
        
        .refresh-btn { 
            width: 3.5vw; height: 3.5vw; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.15); border: 0.2vw solid transparent; color: white; cursor: pointer; transition: 0.3s; outline: none; backdrop-filter: blur(10px);
        }
        .refresh-btn svg { width: 1.6vw; height: 1.6vw; }
        .refresh-btn:focus, .refresh-btn:hover { border-color: white; background: rgba(255,255,255,0.3); transform: scale(1.05); }

        .user-badge { 
            display: flex; align-items: center; gap: 0.8vw; background: rgba(255,255,255,0.15); 
            padding: 0.6vw 1.5vw; border-radius: 2vw; border: 0.2vw solid transparent; outline: none; 
            cursor: pointer; transition: 0.3s; color: white; font-size: 1.4vw; font-weight: bold; backdrop-filter: blur(10px); white-space: nowrap;
        }
        .user-badge svg { width: 1.6vw; height: 1.6vw; }
        .user-badge:focus, .user-badge:hover { border-color: white; background: rgba(255,255,255,0.3); transform: scale(1.05); }

        /* البانر الرئيسي (الهيرو) */
        .hero-banner { position: relative; width: 100vw; height: 60vh; display: none; margin-top: -12vh; }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; }
        .hero-gradient { position: absolute; bottom: 0; width: 100%; height: 70%; background: linear-gradient(to top, var(--bg) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); }
        .hero-content { position: absolute; bottom: 5vh; left: 4vw; width: 50%; text-align: right; display: flex; flex-direction: column; align-items: flex-start; gap: 2vh; }
        .hero-title { font-size: 4vw; font-weight: 900; color: white; text-shadow: 0 0.5vh 2vh rgba(0,0,0,0.9); margin: 0; line-height: 1.2; }
        .hero-actions { display: flex; gap: 1.5vw; margin-top: 1vh; }
        .hero-btn { display: flex; align-items: center; justify-content: center; gap: 1vw; padding: 1.2vh 3vw; border-radius: 1vw; font-size: 1.5vw; font-weight: bold; border: 0.2vw solid transparent; cursor: pointer; outline: none; transition: 0.3s; }
        .hero-btn:focus { transform: scale(1.1); border-color: white; box-shadow: 0 1vh 3vh rgba(0,0,0,0.5); }
        .hero-play { background: #ffffff; color: #000000; }
        .hero-info { background: rgba(109, 109, 110, 0.6); color: #ffffff; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }

        #main-content { padding-bottom: 10vh; }
        
        .row-container { margin-bottom: 3vh; position: relative; }
        .row-title { font-size: 1.8vw; font-weight: bold; margin: 2vh 4vw 1vh 4vw; text-shadow: 2px 2px 5px black; }
        .row-inner { display: flex; gap: 1.2vw; overflow-x: auto; padding: 1vh 4vw; scroll-behavior: smooth; }
        
        .categories-row { display: flex; gap: 1vw; overflow-x: auto; padding: 1vh 4vw; margin-bottom: 2vh; scroll-behavior: smooth; }
        .category-chip { background: rgba(255,255,255,0.1); color: #e0e0e0; padding: 1.2vh 2vw; border-radius: 2vw; font-size: 1.3vw; font-weight: bold; cursor: pointer; border: 0.2vw solid transparent; transition: 0.3s; white-space: nowrap; outline: none; }
        .category-chip:focus, .category-chip.active { background: white; color: black; border-color: white; transform: scale(1.05); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(12vw, 1fr)); gap: 1.5vw; padding: 2vh 4vw; margin-bottom: 5vh; }
        .grid-container.live-grid { grid-template-columns: repeat(auto-fill, minmax(18vw, 1fr)); }

        /* البطاقات الأساسية */
        .card {
            border-radius: 0.8vw; position: relative; background: var(--surface); cursor: pointer; outline: none; 
            transition: transform 0.3s ease, border 0.3s ease; padding: 0; margin: 0; border: 0.25vw solid transparent;
            width: 100%; aspect-ratio: 2 / 3; overflow: hidden; box-shadow: 0 1vh 2vh rgba(0,0,0,0.5);
        }
        .row-inner .card { width: 13vw; flex: 0 0 auto; }
        
        .card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
        
        .card:focus, .card:hover { transform: scale(1.1); border-color: white; z-index: 15; box-shadow: 0 2vh 4vh rgba(0,0,0,0.9); }
        
        .card-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 4; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            padding: 1vw; opacity: 0; transition: opacity 0.3s ease;
        }
        .card:focus .card-overlay { opacity: 1; }
        
        .overlay-title { font-size: 1.3vw; font-weight: bold; margin-bottom: 1vh; color: white; text-shadow: 1px 1px 3px black; line-height: 1.4; }
        .overlay-rating { font-size: 1.1vw; color: gold; font-weight: bold; margin-bottom: 1vh; }
        .overlay-meta-fetched { font-size: 1vw; color: #ccc; font-weight: 600; line-height: 1.8; }

        /* شريط متابعة المشاهدة */
        .resume-card-layout { position: relative; width: 22vw; aspect-ratio: 16 / 9; flex: 0 0 auto; background: var(--surface); border-radius: 1vw; overflow: hidden; border: 0.25vw solid transparent; transition: 0.3s; outline: none; cursor: pointer; box-shadow: 0 1vh 2vh rgba(0,0,0,0.5); }
        .resume-card-layout:focus, .resume-card-layout:hover { transform: scale(1.08); border-color: white; z-index: 15; box-shadow: 0 2vh 4vh rgba(0,0,0,0.8); }
        
        .resume-img-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1; }
        .resume-img-area img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; display: block; } 
        
        .resume-play-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.5); width: 4vw; height: 4vw; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 0.2vw solid white; z-index: 10; backdrop-filter: blur(4px); pointer-events: none; }
        .resume-play-center svg { width: 2vw; height: 2vw; margin-left: 0.3vw; fill: #ffffff; }
        .resume-progress-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 0.8vh; background: rgba(255,255,255,0.25); z-index: 12; pointer-events: none; }
        .resume-progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; }
        .resume-title-overlay { position: absolute; bottom: 1.5vh; right: 1vw; left: 1vw; font-size: 1.2vw; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; z-index: 11; color: #fff; pointer-events: none; }
        
        .resume-info-trigger { position: absolute; top: 1vh; left: 1vw; background: rgba(0,0,0,0.6); width: 2.5vw; height: 2.5vw; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 1.2vw; font-weight: bold; border: 0.1vw solid rgba(255,255,255,0.3); z-index: 15; backdrop-filter: blur(4px); cursor: pointer; transition: 0.3s; }
        .resume-info-trigger:focus { background: var(--primary); border-color: white; transform: scale(1.1); }

        /* بطاقات القنوات */
        .live-card { width: 100%; height: auto; background: transparent; border: none; outline: none; cursor: pointer; display: block; text-align: center; transition: 0.3s; }
        .row-inner .live-card { width: 18vw; flex: 0 0 auto; }
        
        .live-img-wrapper {
            width: 100%; aspect-ratio: 16 / 9; background: var(--surface); border-radius: 0.8vw; position: relative; overflow: hidden; 
            border: 0.25vw solid transparent; transition: 0.3s; box-shadow: 0 1vh 2vh rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
        }
        .live-card:focus .live-img-wrapper { transform: scale(1.08); border-color: white; box-shadow: 0 2vh 4vh rgba(0,0,0,0.9); }
        .live-img-wrapper img { width: 70%; height: 70%; object-fit: contain; z-index: 2; position: relative; }
        
        .live-title { font-size: 1.2vw; margin-top: 1.5vh; font-weight: bold; color: #d0d0d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 3px black; transition: 0.3s; }
        .live-card:focus .live-title { color: white; transform: translateY(-0.5vh); }

        .progress-bar { position: absolute; bottom: 0; left:0; width: 100%; height: 0.8vh; background: rgba(0,0,0,0.6); z-index: 5; pointer-events: none;}
        .progress-fill { height: 100%; background: var(--primary); }

        .load-more-btn { background: rgba(40,40,40,0.9); color: white; padding: 2vh 4vw; font-size: 1.5vw; border-radius: 1vw; border: 0.2vw solid transparent; cursor: pointer; transition: 0.3s; font-weight: bold; outline: none; margin: 3vh auto 5vh auto; display: block; }
        .load-more-btn:focus { background: white; color: black; transform: scale(1.05); }

        /* شاشة التفاصيل الغامرة (Immersive TV Details) */
        #details-screen { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        .details-backdrop-area { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .details-backdrop-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.35; filter: blur(4px); }
        .details-backdrop-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to right, rgba(0,0,0,0.95) 20%, rgba(0,0,0,0.6) 60%, transparent 100%); }
        
        .details-layout { position: relative; z-index: 10; display: flex; gap: 4vw; height: 100vh; padding: 12vh 6vw; box-sizing: border-box; }
        .details-info-col { flex: 1.5; display: flex; flex-direction: column; justify-content: flex-start; gap: 2.5vh; }
        .details-title { font-size: 4vw; font-weight: 900; margin: 0; text-shadow: 2px 2px 8px black; line-height: 1.2; }
        
        .details-meta-box { display: flex; gap: 2vw; background: rgba(255,255,255,0.06); padding: 1.5vh 2vw; border-radius: 1vw; width: fit-content; border: 0.1vw solid rgba(255,255,255,0.1); }
        .meta-item { display: flex; align-items: center; gap: 0.5vw; font-size: 1.3vw; color: white; font-weight: bold; }
        .meta-match { color: #46d369; }

        .details-desc { font-size: 1.4vw; line-height: 1.8; color: #d0d0d0; text-shadow: 1px 1px 3px black; max-width: 90%; margin: 0; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
        
        .action-bar { display: flex; gap: 1.5vw; align-items: center; margin-top: 2vh; }
        .action-btn { background: white; color: black; border: 0.2vw solid transparent; padding: 1.5vh 3vw; font-size: 1.5vw; font-weight: bold; border-radius: 1vw; cursor: pointer; outline: none; transition: 0.3s; display: flex; align-items: center; gap: 0.8vw; box-shadow: 0 1vh 2vh rgba(0,0,0,0.4); }
        .action-btn.outline { background: rgba(45,45,45,0.7); color: white; border-color: rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        .action-btn:focus { transform: scale(1.08); border-color: white; }

        .details-poster-col { flex: 1; display: flex; justify-content: flex-end; align-items: flex-start; }
        .details-poster { width: 22vw; aspect-ratio: 2/3; border-radius: 1vw; box-shadow: 0 2vh 6vh rgba(0,0,0,0.9); object-fit: cover; border: 0.2vw solid rgba(255,255,255,0.1); }
        
        .details-episodes-col { position: absolute; left: 0; top: 0; width: 30vw; height: 100vh; background: rgba(15,15,15,0.95); backdrop-filter: blur(20px); border-right: 0.1vw solid rgba(255,255,255,0.1); padding: 12vh 2vw 4vw 2vw; overflow-y: auto; z-index: 20; }
        .seasons-select { background: rgba(30,30,30,0.8); color: white; padding: 1.5vh 1vw; font-size: 1.3vw; border: 0.2vw solid transparent; border-radius: 0.5vw; outline: none; cursor: pointer; width: 100%; margin-bottom: 3vh; transition: 0.3s; }
        .seasons-select:focus { border-color: white; background: #000; }
        
        .episodes-list-vertical { display: flex; flex-direction: column; gap: 1.5vh; }
        .ep-card { position: relative; background: rgba(35,35,35,0.6); padding: 2vh 1.5vw; border-radius: 0.8vw; cursor: pointer; outline: none; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; border: 0.2vw solid transparent; color: white; font-size: 1.2vw; font-weight: bold; overflow: hidden; }
        .ep-card:focus { background: white; color: black; transform: scale(1.03); border-color: white; z-index: 10; }
        .ep-progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 0.6vh; background: rgba(0,0,0,0.4); pointer-events: none;}
        .ep-progress-fill { height: 100%; background: var(--primary); }

        /* شاشات البداية والتسجيل */
        .login-wrapper { background: rgba(20, 20, 20, 0.92); padding: 4vw; border-radius: 2vw; box-shadow: 0 2vh 6vh rgba(0,0,0,0.9); text-align: center; border: 0.1vw solid rgba(255,255,255,0.1); max-width: 40vw; margin: 15vh auto; backdrop-filter: blur(20px); }
        .login-wrapper h1 { font-size: 4vw; color: var(--primary); margin: 0 0 1vh 0; letter-spacing: 2px; }
        .login-wrapper p { font-size: 1.3vw; color: #aaa; margin: 0 0 4vh 0; }
        .login-wrapper input { width: 100%; background: rgba(255,255,255,0.08); border: 0.2vw solid transparent; color: white; padding: 1.5vw; border-radius: 1vw; font-size: 1.3vw; outline: none; transition: 0.3s; margin-bottom: 2vh; text-align: center; }
        .login-wrapper input:focus { border-color: var(--primary); background: rgba(0,0,0,0.8); transform: scale(1.02); }
        
        .profiles-header { font-size: 4vw; font-weight: bold; color: white; text-align: center; margin-top: 15vh; margin-bottom: 6vh; text-shadow: 0 2px 5px black; }
        .profiles-container { display: flex; gap: 3vw; justify-content: center; flex-wrap: wrap; }
        .profile-card { width: 12vw; height: 12vw; background: linear-gradient(145deg, #1c1c1e, #111112); border-radius: 2vw; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.8vw; font-weight: bold; cursor: pointer; outline: none; transition: 0.3s; border: 0.3vw solid transparent; color: white; box-shadow: 0 1vh 2vh rgba(0,0,0,0.5); position: relative; }
        .profile-card svg { width: 4vw; height: 4vw; margin-bottom: 1vh; color: #aaa; }
        .profile-card:focus { background: white; color: black; transform: scale(1.1); border-color: white; box-shadow: 0 2vh 4vh rgba(0,0,0,0.8); }
        .profile-card:focus svg { color: black; }

        .profile-options-btn { position: absolute; top: 1vh; left: 1vw; font-size: 2vw; color: #aaa; width: 3vw; height: 3vw; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.5); border-radius: 50%; z-index: 10; outline: none; border: 0.2vw solid transparent; }
        .profile-options-btn:focus { border-color: white; color: white; transform: scale(1.1); }
        .profile-menu { position: absolute; top: 4.5vh; left: 1vw; background: #222; border-radius: 1vw; overflow: hidden; z-index: 20; box-shadow: 0 1vh 2vh rgba(0,0,0,0.8); border: 0.1vw solid #444; width: 10vw; }
        .profile-menu button { width: 100%; background: transparent; border: none; padding: 1.5vh 1vw; font-size: 1.2vw; color: white; text-align: center; cursor: pointer; outline: none; transition: 0.3s; }
        .profile-menu button:focus { background: white; color: black; }

        #add-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.92); z-index: 1000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-box { background: #1a1a1a; padding: 4vw; border-radius: 2vw; text-align: center; border: 0.1vw solid rgba(255,255,255,0.1); width: 40vw; }
        .modal-box input { width: 100%; padding: 1.5vw; font-size: 1.5vw; margin: 3vh 0; border-radius: 1vw; border: 0.2vw solid transparent; outline: none; text-align: center; background: rgba(0,0,0,0.5); color: white; transition: 0.3s;}
        .modal-box input:focus { border-color: var(--primary); }

        #player-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        video { width: 100%; height: 100%; outline: none; background: #000; }
    </style>
</head>

    <div id="app-body" style="width:100%; height:100%; position:absolute;">
        <svg style="display: none;">
            <symbol id="icon-user" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>

<script>
    const supabaseUrl = 'https://kpfymvtyqbyjmlqfgujo.supabase.co';
    const supabaseKey = 'sb_publishable_g7dHfpmPHcQwAWsO9FFuGw_4lG8fyLc';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let iptv = { domain: '', user: '', pass: '' };
    let currentProfile = ''; let currentTab = 'movies'; 
    let activeStreamData = null; let searchTimeout = null;
    let currentCategoryItems = []; let displayedItemsCount = 0; const ITEMS_PER_PAGE = 40;
    
    let isPlaying = false;
    let flatEpisodes = [];
    let seekTimer = null; let seekInterval = null; let isLongPress = false;

    window.userActivityMap = {};
    window.favoritesMap = new Map();
    window.allLoadedItems = {};

    // 🚀 متغيرات حفظ موقع التحديد للرجوع بدقة
    let lastFocusedElementMain = null;
    let lastFocusedElementDetails = null;

    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 4000); }
    function escapeHtml(str) { if (str === null || str === undefined) return ''; return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    function safeFocus(el) { if(document.activeElement.tagName !== 'INPUT' && el) el.focus(); }
    
    function focusAndScroll(el) {
        if (!el) { autoFocusFirstElement(); return; }
        el.focus();
        const innerRow = el.closest('.row-inner') || el.closest('.categories-row');
        if (innerRow) {
            const scrollTarget = el.offsetLeft - (innerRow.clientWidth / 2) + (el.clientWidth / 2);
            innerRow.scrollTo({ left: scrollTarget, behavior: 'smooth' });
        }
        const activeScreen = el.closest('.scrollable-screen:not(.hidden)');
        if (activeScreen) {
            const verticalTarget = el.offsetTop - (activeScreen.clientHeight / 2);
            activeScreen.scrollTo({ top: verticalTarget, behavior: 'smooth' });
        }
    }

    function autoFocusFirstElement() {
        setTimeout(() => {
            const currentScreen = document.querySelector('.scrollable-screen:not(.hidden)');
            if(currentScreen && document.activeElement.tagName !== 'INPUT') {
                const firstObj = currentScreen.querySelector('.focusable');
                if(firstObj) firstObj.focus();
            }
        }, 300);
    }

    function performNetworkFetch(url) {
        return new Promise((resolve, reject) => {
            if (window.ReactNativeWebView) {
                const reqId = Math.random().toString(36).substring(7);
                window.pendingFetches[reqId] = { resolve, reject };
                setTimeout(() => { if (window.pendingFetches[reqId]) { window.pendingFetches[reqId].reject(new Error('Timeout')); delete window.pendingFetches[reqId]; }}, 60000);
                window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'PROXY_FETCH', url: url, reqId: reqId }));
            } else { fetch(url).then(r => r.json()).then(resolve).catch(reject); }
        });
    }

    // 🚀 جلب البيانات المباشر الآمن الذكي (بدون تخزين كامل المكتبة في RAM لتجنب انهيار التلفاز)
    async function apiFetch(action, extraParams = '', forceRefresh = false) {
        let domain = iptv.domain; 
        if (domain.endsWith('/')) domain = domain.slice(0, -1); 
        if (!domain.startsWith('http')) domain = 'http://' + domain;
        
        let url = `${domain}/player_api.php?username=${encodeURIComponent(iptv.user)}&password=${encodeURIComponent(iptv.pass)}`;
        if (action) url += `&action=${action}`;
        if (extraParams) url += extraParams;

        const cacheReq = new Request(`https://amjad.cache/${action}${extraParams}`);
        let cache = null;
        try { if ('caches' in window) cache = await caches.open('amjad-tv-cache'); } catch(e) {}

        if (!forceRefresh && cache) {
            try { const cachedRes = await cache.match(cacheReq); if (cachedRes) return await cachedRes.json(); } catch(e) {}
        }

        try {
            const data = await performNetworkFetch(url);
            if (cache && data) { try { await cache.put(cacheReq, new Response(JSON.stringify(data))); } catch(e) {} }
            return data;
        } catch(e) { throw e; }
    }

    async function forceSync() {
        if(confirm('هل تريد مسح الكاش المؤقت وتحديث البيانات من السيرفر الآن؟')) {
            showToast('جاري تحديث المكتبة...');
            try { await caches.delete('amjad-tv-cache'); } catch(e){}
            loadPage(currentTab);
        }
    }

    window.onload = () => { if(localStorage.getItem('iptv_user')) { iptv = { domain: localStorage.getItem('iptv_domain'), user: localStorage.getItem('iptv_user'), pass: localStorage.getItem('iptv_pass') }; fetchProfilesFromSupabase(); } else { autoFocusFirstElement(); } };

    async function login() {
        const d = document.getElementById('iptv-domain').value.trim(); const u = document.getElementById('iptv-user').value.trim(); const p = document.getElementById('iptv-pass').value.trim();
        if(!d || !u || !p) { showToast('أدخل جميع البيانات'); return; }
        try {
            iptv = {domain: d, user: u, pass: p};
            const data = await apiFetch('', '', true);
            if (data && data.user_info && data.user_info.auth === 1) {
                let cDom = d.endsWith('/') ? d.slice(0, -1) : d; if (!cDom.startsWith('http')) cDom = 'http://' + cDom;
                iptv.domain = cDom; localStorage.setItem('iptv_domain', cDom); localStorage.setItem('iptv_user', u); localStorage.setItem('iptv_pass', p);
                fetchProfilesFromSupabase();
            } else throw new Error();
        } catch (e) { showToast('❌ بيانات غير صحيحة'); iptv = { domain: '', user: '', pass: '' }; }
    }

    function logout() { if(confirm('هل أنت متأكد من تسجيل الخروج؟')) { localStorage.clear(); try { caches.delete('amjad-tv-cache'); } catch(e){} location.reload(); } }

    async function fetchProfilesFromSupabase() {
        document.getElementById('login-screen').classList.add('hidden'); document.getElementById('main-screen').classList.add('hidden'); document.getElementById('profiles-screen').classList.remove('hidden');
        document.getElementById('profiles-list').innerHTML = '<h3 style="color:#aaa; width:100%; text-align:center;">جاري التحميل...</h3>';
        try {
            const { data } = await supabaseClient.from('profiles').select('profile_name').eq('username', iptv.user); document.getElementById('profiles-list').innerHTML = '';
            if(data && data.length > 0) { data.forEach(p => renderProfileCard(p.profile_name)); } else { await supabaseClient.from('profiles').insert([{ username: iptv.user, profile_name: 'الرئيسي' }]); renderProfileCard('الرئيسي'); }
            autoFocusFirstElement();
        } catch (e) {}
    }

    function renderProfileCard(name) {
        const card = document.createElement('button'); card.className = 'profile-card focusable'; card.tabIndex = 0;
        card.innerHTML = `<button class="profile-options-btn focusable" tabindex="0" onclick="event.stopPropagation(); window.toggleProfileMenu('${name}')">⋮</button><div id="menu-${name}" class="profile-menu hidden"><button class="focusable" tabindex="0" onclick="event.stopPropagation(); window.openEditProfileModal('${name}')">تعديل الاسم</button><button class="focusable" tabindex="0" onclick="event.stopPropagation(); window.deleteProfile('${name}')" style="color:var(--primary);">حذف المستخدم</button></div><div style="pointer-events:none;"><svg class="svg-icon"><use href="#icon-user"></use></svg><br><span>${name}</span></div>`;
        card.onclick = () => selectProfile(name); card.addEventListener('mouseenter', (e) => safeFocus(e.target));
        document.getElementById('profiles-list').appendChild(card);
    }

    window.toggleProfileMenu = (name) => { document.querySelectorAll('.profile-menu').forEach(m => { if(m.id !== `menu-${name}`) m.classList.add('hidden'); }); document.getElementById(`menu-${name}`).classList.toggle('hidden'); };
    function openAddProfileModal() { editingProfileName = null; document.getElementById('modal-title').innerText = 'اسم المستخدم الجديد'; document.getElementById('new-profile-input').value = ''; document.getElementById('add-modal').classList.remove('hidden'); setTimeout(()=> document.getElementById('new-profile-input').focus(), 100); }
    window.openEditProfileModal = (oldName) => { editingProfileName = oldName; document.getElementById('menu-' + oldName).classList.add('hidden'); document.getElementById('modal-title').innerText = 'تعديل اسم المستخدم'; document.getElementById('new-profile-input').value = oldName; document.getElementById('add-modal').classList.remove('hidden'); setTimeout(()=> document.getElementById('new-profile-input').focus(), 100); };

    async function saveNewProfile() {
        let newName = document.getElementById('new-profile-input').value.trim(); if(!newName) return; document.getElementById('add-modal').classList.add('hidden'); 
        if (editingProfileName) {
            await supabaseClient.from('profiles').update({ profile_name: newName }).eq('username', iptv.user).eq('profile_name', editingProfileName);
            await supabaseClient.from('user_activity').update({ profile_name: newName }).eq('username', iptv.user).eq('profile_name', editingProfileName);
            await supabaseClient.from('favorites').update({ profile_name: newName }).eq('username', iptv.user).eq('profile_name', editingProfileName);
        } else { await supabaseClient.from('profiles').upsert({ username: iptv.user, profile_name: newName }, { onConflict: 'username,profile_name' }); }
        fetchProfilesFromSupabase();
    }
    window.deleteProfile = async (name) => { document.getElementById('menu-' + name).classList.add('hidden'); if(confirm(`تأكيد حذف "${name}"؟`)) { await supabaseClient.from('profiles').delete().eq('username', iptv.user).eq('profile_name', name); fetchProfilesFromSupabase(); } };
    function changeProfile() { fetchProfilesFromSupabase(); }

    async function selectProfile(name) {
        currentProfile = name; document.getElementById('current-profile-name').innerText = name; document.getElementById('profiles-screen').classList.add('hidden'); 
        await Promise.all([fetchAllUserActivity(), loadFavoritesMap()]);
        document.getElementById('main-screen').classList.remove('hidden'); 
        loadPage('movies');
    }

    async function fetchAllUserActivity() {
        try {
            const { data } = await supabaseClient.from('user_activity').select('movie_id, resume_time, item_type, item_data').eq('username', iptv.user).eq('profile_name', currentProfile);
            window.userActivityMap = {}; if(data) data.forEach(r => { window.userActivityMap[String(r.movie_id)] = { resume_time: r.resume_time, type: r.item_type, episodes_progress: r.item_data?.episodes_progress || {} }; });
        } catch(e){}
    }

    async function loadFavoritesMap() { window.favoritesMap = new Map(); try { const { data } = await supabaseClient.from('favorites').select('id, item_id').eq('username', iptv.user).eq('profile_name', currentProfile); if (data) data.forEach(r => window.favoritesMap.set(String(r.item_id), r.id)); } catch(e) {} }
    async function loadSupabaseFavorites(returnRaw = false) {
        try {
            const { data } = await supabaseClient.from('favorites').select('*').eq('username', iptv.user).eq('profile_name', currentProfile); window.favoritesMap = new Map();
            const items = data.map(r => { window.favoritesMap.set(String(r.item_id), r.id); let obj = typeof r.item_data === 'string' ? JSON.parse(r.item_data) : r.item_data; obj.item_type = r.item_type; return obj; }); return items;
        } catch(e) { return []; }
    }

    function setHeaderStyle(isSticky) {
        const header = document.getElementById('main-header');
        if (isSticky) { header.className = 'header-sticky'; } 
        else { header.className = 'header-absolute'; }
    }

    function handleSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (query === '') { loadPage(currentTab); return; }
            
            setHeaderStyle(true); document.getElementById('hero-banner').style.display = 'none';
            document.getElementById('continue-watching-container').innerHTML = ''; document.getElementById('categories-container').innerHTML = ''; document.getElementById('load-more-container').innerHTML = '';
            document.getElementById('grid-container').innerHTML = '<h3 style="grid-column: 1 / -1; text-align:center; font-size:2vw; color:#aaa; margin-top:5vh;">جاري البحث...</h3>';
            
            let action = currentTab === 'movies' ? 'get_vod_streams' : (currentTab === 'series' ? 'get_series' : 'get_live_streams');
            try {
                let allItems = (currentTab === 'favorites') ? await loadSupabaseFavorites(true) : await apiFetch(action);
                currentCategoryItems = allItems.filter(item => (item.name || item.title || '').toLowerCase().includes(query));
                document.getElementById('grid-container').innerHTML = ''; displayedItemsCount = 0;
                
                if(currentCategoryItems.length > 0) renderGridItems(currentTab === 'movies' ? 'movie' : (currentTab === 'series' ? 'series' : 'live'));
                else document.getElementById('grid-container').innerHTML = '<h3 style="grid-column: 1 / -1; text-align:center; font-size:2vw; color:#aaa; margin-top:5vh;">لا يوجد نتائج متطابقة</h3>';
            } catch (e) {
                document.getElementById('grid-container').innerHTML = '<h3 style="grid-column: 1 / -1; text-align:center; font-size:2vw; color:#aaa; margin-top:5vh;">حدث خطأ في البحث</h3>';
            }
        }, 600);
    }

    async function loadPage(type) {
        if(currentTab === type && document.getElementById('main-screen').scrollTop > 0 && document.getElementById('search-input').value === '') { document.getElementById('main-screen').scrollTo({top: 0, behavior: 'smooth'}); return; }
        currentTab = type; 
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); const activeNavBtn = document.querySelector(`.nav-item[onclick*="'${type}'"]`); if(activeNavBtn) activeNavBtn.classList.add('active');
        document.getElementById('search-input').value = '';
        
        const grid = document.getElementById('grid-container'); grid.className = 'grid-container'; 
        if (type === 'live') grid.classList.add('live-grid'); else if (type === 'favorites') grid.classList.add('favorites-grid');
        
        if(type === 'live' || type === 'favorites') { setHeaderStyle(true); document.getElementById('hero-banner').style.display = 'none'; } 
        else { setHeaderStyle(false); }

        document.getElementById('continue-watching-container').innerHTML = ''; grid.innerHTML = ''; document.getElementById('load-more-container').innerHTML = '';

        if (type === 'movies') { 
            await loadSupabaseRows('user_activity', `متابعة المشاهدة`, 'movie'); 
            await fetchCategories('get_vod_categories', 'movie'); 
        } else if (type === 'series') { 
            await loadSupabaseRows('user_activity', `متابعة المشاهدة`, 'series'); 
            await fetchCategories('get_series_categories', 'series'); 
        } else if (type === 'live') { 
            await fetchCategories('get_live_categories', 'live'); 
        } else if (type === 'favorites') { 
            document.getElementById('categories-container').innerHTML = ''; 
            currentCategoryItems = await loadSupabaseFavorites(); displayedItemsCount = 0; renderGridItems('mixed'); 
        }
        autoFocusFirstElement();
    }

    async function fetchCategories(catAction, itemType) {
        document.getElementById('categories-container').innerHTML = '<h3 style="padding:2vw; text-align:center; color:#fff;">جاري تحميل التصنيفات...</h3>';
        try {
            const cats = await apiFetch(catAction);
            if(!cats || cats.length === 0) { document.getElementById('categories-container').innerHTML = ''; return; }
            let html = `<div class="categories-row">`;
            cats.forEach((cat, index) => { html += `<button class="category-chip focusable ${index === 0 ? 'active' : ''}" tabindex="0" data-id="${cat.category_id}">${escapeHtml(cat.category_name)}</button>`; });
            html += `</div>`;
            document.getElementById('categories-container').innerHTML = html;

            const chips = document.querySelectorAll('.category-chip');
            chips.forEach(chip => {
                chip.addEventListener('mouseenter', (e) => safeFocus(e.target));
                chip.onclick = () => { 
                    chips.forEach(c => c.classList.remove('active')); chip.classList.add('active'); 
                    let streamAction = itemType === 'movie' ? 'get_vod_streams' : (itemType === 'series' ? 'get_series' : 'get_live_streams');
                    loadCategoryItemsLocal(chip.getAttribute('data-id'), streamAction, itemType); 
                };
            });
            let streamAction = itemType === 'movie' ? 'get_vod_streams' : (itemType === 'series' ? 'get_series' : 'get_live_streams');
            loadCategoryItemsLocal(cats[0].category_id, streamAction, itemType);
        } catch(e) {
            document.getElementById('categories-container').innerHTML = '<h3 style="padding:2vw; text-align:center; color:#aaa;">حدث خطأ في جلب التصنيفات</h3>';
        }
    }

    async function loadCategoryItemsLocal(catId, streamAction, itemType) {
        const grid = document.getElementById('grid-container');
        grid.innerHTML = '<h3 style="grid-column: 1 / -1; text-align:center; font-size:2vw; color:#aaa; margin-top:5vh;">جاري التحميل...</h3>';
        document.getElementById('load-more-container').innerHTML = '';
        
        try {
            currentCategoryItems = await apiFetch(streamAction, `&category_id=${catId}`);
            displayedItemsCount = 0; grid.innerHTML = '';
            if(currentCategoryItems && currentCategoryItems.length > 0) {
                renderGridItems(itemType);
                if(itemType !== 'live') updateHeroSection(currentCategoryItems, itemType);
            } else {
                document.getElementById('hero-banner').style.display = 'none';

    document.addEventListener('keydown', (e) => {
        if (isPlaying) {
            if (e.keyCode === 37 || e.keyCode === 39) {
                if (e.repeat) return; let direction = (e.keyCode === 39) ? 1 : -1; isLongPress = false; seekTimer = setTimeout(() => { isLongPress = true; seekInterval = setInterval(() => { video.currentTime += (direction * 5); }, 150); }, 400);
            } return;
        }

        if (e.keyCode === 13) { if(document.activeElement && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.activeElement.click(); } return; }

        const KEYS = [37, 38, 39, 40];
        if (KEYS.includes(e.keyCode)) {
            if(document.activeElement.tagName === 'INPUT' && (e.keyCode === 37 || e.keyCode === 39)) return; 
            e.preventDefault(); let current = document.activeElement; if (!current || !current.classList.contains('focusable')) { autoFocusFirstElement(); return; }

            let rect = getStaticLayoutRect(current); let focusables = Array.from(document.querySelectorAll('.focusable')).filter(el => el.offsetParent !== null && window.getComputedStyle(el).display !== 'none');
            let bestMatch = null; let minDistance = Infinity;

            focusables.forEach(f => {
                if(f === current) return; let r = getStaticLayoutRect(f); let dx = 0, dy = 0, dist = Infinity;
                if(e.keyCode === 37 && r.right <= rect.left + 5) { dx = rect.left - r.right; dy = Math.abs((rect.top+rect.bottom)/2 - (r.top+r.bottom)/2); dist = dx + dy*4; }
                else if(e.keyCode === 39 && r.left >= rect.right - 5) { dx = r.left - rect.right; dy = Math.abs((rect.top+rect.bottom)/2 - (r.top+r.bottom)/2); dist = dx + dy*4; }
                else if(e.keyCode === 38 && r.bottom <= rect.top + 5) { dy = rect.top - r.bottom; dx = Math.abs((rect.left+rect.right)/2 - (r.left+r.right)/2); dist = dy + dx*4; }
                else if(e.keyCode === 40 && r.top >= rect.bottom - 5) { dy = r.top - rect.bottom; dx = Math.abs((rect.left+rect.right)/2 - (r.left+r.right)/2); dist = dy + dx*4; }
                if(dist < minDistance) { minDistance = dist; bestMatch = f; }
            });

            if(bestMatch) { focusAndScroll(bestMatch); }
        }
    });

    document.addEventListener('keyup', (e) => {
        if (!isPlaying) return;
        if (e.keyCode === 37 || e.keyCode === 39) { clearTimeout(seekTimer); clearInterval(seekInterval); if (!isLongPress) { if (e.keyCode === 39) video.currentTime += 10; if (e.keyCode === 37) video.currentTime -= 10; } isLongPress = false; }
    });

    document.querySelectorAll('.scrollable-screen').forEach(screen => { screen.addEventListener('scroll', () => { const header = document.getElementById('main-header'); if(screen.scrollTop > 30) header.classList.add('scrolled'); else header.classList.remove('scrolled'); }); });

    window.addEventListener('popstate', (e) => {
        if (isPlaying) {
            isPlaying = false; video.pause(); video.src = ""; video.load();
            const nextEpBtn = document.getElementById('next-episode-btn'); if (nextEpBtn) nextEpBtn.remove();
            document.getElementById('player-container').classList.add('hidden');
            if(activeStreamData && activeStreamData.type === 'live') { document.getElementById('main-screen').classList.remove('hidden'); setTimeout(() => { focusAndScroll(lastFocusedElementMain); }, 50); } 
            else { document.getElementById('details-screen').classList.remove('hidden'); setTimeout(() => { focusAndScroll(lastFocusedElementDetails); }, 50); }
        } else {
            document.getElementById('details-screen').classList.add('hidden'); document.getElementById('main-screen').classList.remove('hidden'); silentRefreshContinueWatching();
            setTimeout(() => { focusAndScroll(lastFocusedElementMain); }, 50);
        }
    });
</script>
</body>
</html>
